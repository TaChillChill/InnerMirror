<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InnerMirror Prototype v2</title>
  <meta name="description" content="Clickable user-flow prototype for Founder UX review. Synthetic data, no AI calls.">
  <link rel="icon" href="../brand/logo-interim/app-icon-color.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../showcase/tokens.css">
  <link rel="stylesheet" href="../showcase/components.css">
  <link rel="stylesheet" href="prototype.css">
  <link rel="stylesheet" href="prototype-mirror.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
      <symbol id="i-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.5h9a1.5 1.5 0 011.5 1.5v16l-6-4-6 4V5a1.5 1.5 0 011.5-1.5z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></symbol>
      <symbol id="i-device" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18.5h3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5h5v2M7 7l.8 12.2a2 2 0 002 1.8h4.4a2 2 0 002-1.8L17 7"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.75"/><path d="M20.5 16l-5-5-8.5 8.5"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14M5 11.5h14M5 16.5h9"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v4M12 16.5v4M3.5 12h4M16.5 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></symbol>
      <symbol id="i-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7.5v9M18 11c0 4-6 3-11.5 6"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1-4L15.5 5.5l3 3-10 10z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 19.5h16M7 16V11M12 16V6M17 16v-3"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    </defs>
  </svg>

  <!-- Reviewer controls: prototype only, never part of the product. -->
  <aside class="pt-review" aria-label="Prototype controls">
    <div class="pt-review__inner">
      <strong>Prototype v2 · synthetic data · no AI calls</strong>
      <label>Jump to
        <select id="pt-jump">
          <option value="landing">1 Landing</option>
          <option value="add">2 Add a conversation</option>
          <option value="review">3 Review as a chat</option>
          <option value="replay">4 Replay + What if?</option>
          <option value="mirror">5 My Mirror</option>
        </select>
      </label>
      <label><input type="checkbox" id="pt-safety"> 6 Safety-flagged chat</label>
      <label><input type="checkbox" id="pt-seed" checked> Illustrative saved collections (off = empty state)</label>
      <label><input type="checkbox" id="pt-decisions" checked> Show open decisions</label>
      <button type="button" class="pt-link" id="pt-reset">Reset (clears saved)</button>
    </div>
  </aside>

  <header class="pt-bar">
    <button type="button" class="pt-home" data-go="landing" aria-label="InnerMirror home">
      <img src="../brand/logo-interim/app-icon-color.png" alt="" width="32" height="32"><span>InnerMirror</span>
    </button>
    <div id="pt-stepper"></div>
    <button type="button" class="im-btn im-btn--ghost im-btn--sm pt-mirror-link" id="pt-mirror-link" data-go="mirror"></button>
  </header>

  <main id="app" tabindex="-1"></main>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="screens-input.js"></script>
  <script src="screens-review.js"></script>
  <script src="screens-replay.js"></script>
  <script src="screens-mirror.js"></script>
  <script src="mirror-patterns.js"></script>
  <script src="app.js"></script>
</body>
</html>
