<!doctype html>
<!-- Synthetic chat screenshots for the demo film (conversation A). A neutral messenger look on
     purpose: no real app's colours, icons or name. Rendered by shots/render.mjs (?part=1..3). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #f6f6f8; font-family: -apple-system, "Helvetica Neue", sans-serif; color: #1c1c1e; display: flex; flex-direction: column; }
  .status { height: 47px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 8px; font-weight: 600; font-size: 16px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; border-bottom: 1px solid #e3e3e8; background: #fbfbfd; }
  .back { font-size: 26px; color: #3f7d74; width: 18px; }
  .pic { width: 36px; height: 36px; border-radius: 50%; background: #f0e7d8; display: grid; place-items: center; color: #64502c; font-weight: 700; }
  .name { font-weight: 600; font-size: 17px; }
  .thread { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px 12px 10px; overflow: hidden; }
  .time { align-self: center; font-size: 12px; color: #8a8a90; margin: 10px 0 4px; }
  .b { max-width: 76%; padding: 9px 14px; border-radius: 19px; font-size: 17px; line-height: 1.3; }
  .j { align-self: flex-start; background: #e5e5ea; border-bottom-left-radius: 6px; }
  .x { align-self: flex-end; background: #3f7d74; color: #fff; border-bottom-right-radius: 6px; }
  .bar { height: 84px; border-top: 1px solid #e3e3e8; background: #fbfbfd; padding: 10px 14px; }
  .field { height: 38px; border-radius: 19px; border: 1px solid #d1d1d6; padding: 0 14px; display: flex; align-items: center; color: #a0a0a6; font-size: 16px; }
</style>
</head>
<body>
  <div class="status"><span id="clock">9:41</span><span>●●● ▮</span></div>
  <div class="head"><span class="back">‹</span><span class="pic">J</span><span class="name">Jordan</span></div>
  <div class="thread" id="t"></div>
  <div class="bar"><div class="field">Message</div></div>
<script>
  // Conversation A, verbatim from design/film/src/story.ts. Each part overlaps the next by one
  // message, the way consecutive screenshots usually do.
  const CHAT = [
    ["J", "dinner at 7 still? got the good wine 🍷"], ["X", "yesss 100%. leaving at 6"], ["X", "ugh meeting ran over. 20 min"],
    ["J", "k"], ["X", "k?? i said sorry"], ["J", "u didn't actually"], ["X", "wow ok. i'm literally rushing rn"],
    ["J", "it's fine. it's always fine"], ["X", "what's that supposed to mean"], ["J", "it means i'm tired of always being the one who waits"],
    ["X", "and i'm tired of feeling guilty for working"], ["J", "then eat at the office lol"], ["X", "fine. do whatever u want."],
  ];
  const PARTS = { 1: [0, 5, "Today 4:12 PM", "6:48"], 2: [4, 9, "Today 6:44 PM", "7:03"], 3: [8, 13, "Today 7:01 PM", "11:47"] };
  const [from, to, stamp, clock] = PARTS[new URLSearchParams(location.search).get("part") ?? "1"];
  document.getElementById("clock").textContent = clock;
  const t = document.getElementById("t");
  t.insertAdjacentHTML("beforeend", `<div class="time">${stamp}</div>`);
  for (const [who, text] of CHAT.slice(from, to)) t.insertAdjacentHTML("beforeend", `<div class="b ${who === "J" ? "j" : "x"}">${text}</div>`);
</script>
</body>
</html>
